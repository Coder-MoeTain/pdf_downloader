name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pip-audit pytest-cov
      - name: Tests
        env:
          APP_ENV: testing
          SESSION_SECRET: pytest-session-secret-value-must-be-32bytes-min
          ALLOWED_HOSTS: testserver,localhost,127.0.0.1
        run: pytest --cov=app --cov-report=term-missing
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy --follow-imports=skip app/security app/exceptions.py app/services/oa_status.py app/database/identifiers.py app/config.py
      - name: Security scan
        run: bandit -r app -ll
      - name: Dependency audit
        run: pip-audit
      - name: Migration smoke test
        env:
          APP_ENV: testing
          SESSION_SECRET: pytest-session-secret-value-must-be-32bytes-min
        run: alembic upgrade head
      - name: Application import
        env:
          APP_ENV: testing
          SESSION_SECRET: pytest-session-secret-value-must-be-32bytes-min
          ALLOWED_HOSTS: testserver,localhost,127.0.0.1
        run: python -c "from app.web import app; print(app.title)"
